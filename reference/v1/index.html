                this.y = -10;
                this.vx = (Math.random() - 0.3) * 300;
                this.vy = 400 + Math.random() * 200;
                this.life = 0.8;
                this.maxLife = 0.8;
                this.length = 30 + Math.random() * 40;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
            }
            draw(ctx) {
                const alpha = this.life / this.maxLife;
                const tailX = this.x - (this.vx * 0.05) * this.length / 30;
                const tailY = this.y - (this.vy * 0.05) * this.length / 30;
                const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
                grad.addColorStop(0, `rgba(255,255,255,0)`);
                grad.addColorStop(1, `rgba(255,255,255,${alpha * 0.8})`);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
            isDead() { return this.life <= 0; }
        }

        // ============================================
        // SPIRAL MISSILE CLASS
        // ============================================
        class SpiralMissile {
            constructor(x, y, angleOffset, spiralDir) {
                this.x = x;
                this.y = y;
                this.angle = angleOffset;         // initial launch angle
                this.spiralDir = spiralDir;        // 1 or -1 for CW/CCW
                this.speed = 60;                   // starts slow
                this.maxSpeed = 320;
                this.accel = 280;
                this.spiralRate = 4.5;             // radians/sec spiral spin
                this.life = 4.0;                   // seconds alive
                this.maxLife = 4.0;
                this.target = null;
                this.seekStrength = 0;             // ramps up over time
                this.radius = 5;
                this.damage = 2;
                this.hue = (angleOffset / (Math.PI * 2)) * 360;
                this.trail = [];
            }

            update(dt) {
                this.life -= dt;
                this.speed = Math.min(this.maxSpeed, this.speed + this.accel * dt);
                this.seekStrength = Math.min(8, this.seekStrength + 3 * dt);

                // Spiral motion
                this.angle += this.spiralRate * this.spiralDir * dt;
                // Reduce spiral over time as seeking takes over
                this.spiralRate = Math.max(1.5, this.spiralRate - 0.8 * dt);

                // Find nearest enemy target
                let bestDist = 999999;
                this.target = null;
                for (const enemy of entities.enemies) {
                    const dx = enemy.x - this.x;
                    const dy = enemy.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < bestDist) {
                        bestDist = dist;
                        this.target = enemy;
                    }
                }
                // Also target asteroids if no enemies
                if (!this.target) {
                    for (const ast of entities.asteroids) {
                        const dx = ast.x - this.x;
                        const dy = ast.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < bestDist) {
                            bestDist = dist;
                            this.target = ast;
                        }
                    }
                }

                // Seek towards target
                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const targetAngle = Math.atan2(dy, dx);
                    let angleDiff = targetAngle - this.angle;
                    // Normalize
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    this.angle += angleDiff * this.seekStrength * dt;
                }

                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;
                this.x += vx * dt;
                this.y += vy * dt;

                // Store trail points
                this.trail.push({ x: this.x, y: this.y, age: 0 });
                if (this.trail.length > 20) this.trail.shift();
                for (const p of this.trail) p.age += dt;

                // Colorful spiral particles
                this.hue = (this.hue + 200 * dt) % 360;
                if (Math.random() < 0.6) {
                    spawnTrailParticle(
                        this.x + (Math.random() - 0.5) * 6,
                        this.y + (Math.random() - 0.5) * 6,
                        vx * -0.3 + (Math.random() - 0.5) * 60,
                        vy * -0.3 + (Math.random() - 0.5) * 60,
                        `hsla(${this.hue}, 100%, 70%, 0.8)`,
                        0.3 + Math.random() * 0.2
                    );
                }

                // Wrap around screen edges for cool effect
                if (this.x < -20) this.x = CONFIG.VIRTUAL_WIDTH + 20;
                if (this.x > CONFIG.VIRTUAL_WIDTH + 20) this.x = -20;
                if (this.y < -20) this.y = CONFIG.VIRTUAL_HEIGHT + 20;
                if (this.y > CONFIG.VIRTUAL_HEIGHT + 20) this.y = -20;
            }

            draw(ctx, offsetX, offsetY) {
                // Draw trail
                if (this.trail.length > 1) {
                    for (let i = 1; i < this.trail.length; i++) {
                        const p0 = this.trail[i - 1];
                        const p1 = this.trail[i];
                        const alpha = (i / this.trail.length) * 0.6 * (this.life / this.maxLife);
                        const hue = (this.hue + i * 15) % 360;
                        ctx.strokeStyle = `hsla(${hue}, 100%, 65%, ${alpha})`;
                        ctx.lineWidth = 2 + (i / this.trail.length) * 2;
                        ctx.beginPath();
                        ctx.moveTo(p0.x - offsetX, p0.y - offsetY);
                        ctx.lineTo(p1.x - offsetX, p1.y - offsetY);
                        ctx.stroke();
                    }
                }

                const x = this.x - offsetX;
                const y = this.y - offsetY;
                const alpha = Math.min(1, this.life / this.maxLife * 2);

                // Outer glow
                const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, 14);
                glowGrad.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${alpha * 0.6})`);
                glowGrad.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(x, y, 14, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();

                // White hot center
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
                ctx.beginPath();
                ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            isDead() { return this.life <= 0; }
        }

        // Spawn a full spiral burst from player position
        let spiralCooldown = 0;
        function spawnSpiralBurst() {
            if (!entities.player) return;
            const px = entities.player.x;
            const py = entities.player.y;
            const missileCount = 12;

            // Sound effect: ascending arpeggio
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    playSound(300 + i * 80, 0.15, 'sine', 0.15, 200);
                }, i * 40);
            }

            // Big flash
            triggerScreenFlash(0.15, 'cyan');
            spawnExplosion(px, py, 20, 'rgb(100, 200, 255)');

            const floatText = new FloatingText(px, py - 30, 'SPIRAL STORM!', 'rgb(100, 255, 255)', 16, 1.2);
            entities.floatingTexts.push(floatText);

            for (let i = 0; i < missileCount; i++) {
                const angle = (i / missileCount) * Math.PI * 2;
                const dir = i % 2 === 0 ? 1 : -1;
                const missile = new SpiralMissile(px, py, angle, dir);
                entities.spiralMissiles.push(missile);
            }
        }

        // ============================================
        // UPGRADE SYSTEM
        // ============================================
        const UPGRADES = [
            { id: 'Double Shot', name: 'Double Shot', desc: '2 extra side bolts', drawIcon: 'tentacle_split', type: 'offense' },
            { id: 'Rapid Fire', name: 'Rapid Fire', desc: '-30% fire interval', drawIcon: 'tentacle_rapid', type: 'offense' },
            { id: 'Piercing Shot', name: 'Piercing Shot', desc: 'Bolts pierce enemies', drawIcon: 'tentacle_pierce', type: 'offense' },
            { id: 'Homing Burst', name: 'Homing Burst', desc: '5th shot homes in', drawIcon: 'eye_target', type: 'offense' },
            { id: 'Shield Layer', name: 'Shield Layer', desc: '+1 shield hit', drawIcon: 'shell_shield', type: 'defense' },
            { id: 'Phase Extender', name: 'Phase Extender', desc: '+0.2s i-frames', drawIcon: 'ghost_phase', type: 'defense' },
            { id: 'Damage Forgiveness', name: 'Damage Forgiveness', desc: '1 free hit per 30s', drawIcon: 'ink_cloud', type: 'defense' },
            { id: 'Nano Repair', name: 'Nano Repair', desc: 'Regen shield slowly', drawIcon: 'healing_tentacle', type: 'defense' },
            { id: 'Magnet Pull', name: 'Magnet Pull', desc: 'Auto-collect 100px', drawIcon: 'sucker_pull', type: 'utility' },
            { id: 'Combo Sustain', name: 'Combo Sustain', desc: 'Combo timer +1.5s', drawIcon: 'chain_tentacle', type: 'utility' },
            { id: 'Turbo Boost', name: 'Turbo Boost', desc: '+20% move speed', drawIcon: 'jet_squid', type: 'utility' },
            { id: 'Score Frenzy', name: 'Score Frenzy', desc: '+50% score 30s', drawIcon: 'treasure_eye', type: 'utility' },
        ];

        function getRandomUpgrades(count = 3) {
            const available = UPGRADES.filter(u => !game.upgrades.includes(u.id));
            const shuffled = available.sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        function applyUpgrade(upgradeId) {
            game.upgrades.push(upgradeId);
            game.upgradeChoices.push(upgradeId);

            // Set timer for temporary upgrades
            if (UPGRADE_DURATIONS[upgradeId]) {
                game.upgradeTimers[upgradeId] = UPGRADE_DURATIONS[upgradeId];
            }

            switch (upgradeId) {
                case 'Rapid Fire':
                    if (entities.player) entities.player.fireRate *= 0.7;
                    break;
                case 'Turbo Boost':
                    CONFIG.PLAYER_SPEED *= 1.2;
                    break;
                case 'Combo Sustain':
                    CONFIG.COMBO_TIMEOUT += 1.5;
                    break;
                case 'Shield Layer':
                    if (entities.player) {
                        entities.player.maxHp++;
                        entities.player.hp = entities.player.maxHp;
                    }
                    break;
                case 'Phase Extender':
                    CONFIG.ROLL_IFRAMES += 0.2;
                    break;
            }
        }

        function removeUpgrade(upgradeId) {
            const idx = game.upgrades.indexOf(upgradeId);
            if (idx === -1) return;
            game.upgrades.splice(idx, 1);
            delete game.upgradeTimers[upgradeId];

            // Reverse the effect
            switch (upgradeId) {
                case 'Rapid Fire':
                    if (entities.player) entities.player.fireRate /= 0.7;
                    break;
                case 'Turbo Boost':
                    CONFIG.PLAYER_SPEED /= 1.2;
                    break;
                case 'Combo Sustain':
                    CONFIG.COMBO_TIMEOUT = Math.max(2, CONFIG.COMBO_TIMEOUT - 1.5);
                    break;
            }

            // Visual feedback
            if (entities.player) {
                const lostText = new FloatingText(
                    entities.player.x, entities.player.y - 30,
                    `-${upgradeId}`, 'rgb(255, 80, 80)', 11, 1.2
                );
                entities.floatingTexts.push(lostText);
            }
        }

        function updateUpgradeTimers(dt) {
            for (const id of Object.keys(game.upgradeTimers)) {
                game.upgradeTimers[id] -= dt;
                if (game.upgradeTimers[id] <= 0) {
                    removeUpgrade(id);
                }
            }
        }

        function loseRandomOffensiveUpgrade() {
            const offensive = game.upgrades.filter(id => UPGRADE_DURATIONS[id]);
            if (offensive.length === 0) return;
            const victim = offensive[Math.floor(Math.random() * offensive.length)];
            removeUpgrade(victim);
            // Extra feedback
            if (entities.player) {
                spawnExplosion(entities.player.x, entities.player.y, 6, 'rgb(255, 50, 50)');
            }
        }

        // ============================================
        // FLOATING TEXT CLASS
        // ============================================
        class FloatingText {
            constructor(x, y, text, color, size, duration) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.size = size;
                this.duration = duration;
                this.life = duration;
                this.vy = -80; // float upward
            }

            update(dt) {
                this.y += this.vy * dt;
                this.life -= dt;
            }

            draw(ctx, offsetX, offsetY) {
                const alpha = Math.max(0, this.life / this.duration);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text, this.x - offsetX, this.y - offsetY);
                ctx.restore();
            }

            isDead() {
                return this.life <= 0;
            }
        }

            }

            // Drifters share the enemies list but are scenery: never wave-critical.
            static hostiles() { return entities.enemies.filter(e => !e.isDrifter).length; }

            update(dt) {
                this.time += dt;
                this.phaseTimer += dt;
                if (this.phase === 'PEACE') {
                    if (this.phaseTimer >= this.peaceDuration) this.startAttack();
                } else {
                    this.spawnTimer += dt;
                    const interval = Math.max(0.42, 1.05 - this.wave * 0.035);
                    if (this.spawnTimer >= interval && this.attackBudgetSpent < this.attackBudget) {
                        if (this.trySpawn()) this.spawnTimer = 0;
                    }
                    if (this.attackBudgetSpent >= this.attackBudget && Director.hostiles() === 0) {
                        this.startPeace(true);
                    } else if (this.phaseTimer > 38) {
                        this.startPeace(false);
                    }
                }
                this.maxDifficulty = Math.min(4, 1 + this.wave * 0.12);
                this.enemyBulletSpeed = Math.min(245, 155 + (this.wave - 1) * 6);
            }

            startAttack() {
                this.wave++;
                this.phase = 'ATTACK';
                this.phaseTimer = 0;
                this.attackBudget = Math.min(28, 3 + this.wave * 2);
                this.attackBudgetSpent = 0;
                this.spawnTimer = -0.5;
                this.escaped = 0;
                this.isEscortWave = this.wave % 4 === 0;
                game.wave = this.wave;
                game.waveBanner = {
                    text: `WAVE ${this.wave}${this.isEscortWave ? ' · RAIDER ESCORT' : ''}`,
                    timer: 0,
                    duration: 2
                };
            }

            startPeace(cleared = true) {
                this.phase = 'PEACE';
                this.phaseTimer = 0;
                this.peaceDuration = 4;
                entities.enemyBullets = [];
                // Timeouts retire lingering ships so the next wave remains readable.
                if (!cleared) entities.enemies = [];
                this.spawnDrifters();
                if (cleared) {
                    window.expedition?.onWaveComplete(this.wave);
                    if (game.bestWave < this.wave) {
                        game.bestWave = this.wave;
                        writeRecord('kuiper_bestWave', game.bestWave);
                    }
                    const perfect = this.escaped === 0;
                    const bonus = this.wave * (perfect ? 200 : 100);
                    game.score += bonus;
                    game.waveBanner = { text: `${perfect ? 'PERFECT CLEAR' : 'SECTOR CLEAR'} +${bonus}`, timer: 0, duration: 2.5 };
                    if (entities.player && this.wave % 2 === 0) {
                        entities.pickups.push(new Pickup(CONFIG.VIRTUAL_WIDTH / 2, 180, 'energy'));
                    }
                    // Choosing upgrades during recovery keeps the battle uninterrupted.
                    if (this.wave % 2 === 0) game.upgradeTime = CONFIG.UPGRADE_INTERVAL;
                }
            }

            trySpawn() {
                if (this.phase !== 'ATTACK' || Director.hostiles() >= 7 || this.attackBudgetSpent >= this.attackBudget) return false;
                const remaining = this.attackBudget - this.attackBudgetSpent;
                let type = 'scout';
                let cost = 1;
                const roll = Math.random();
                if (this.isEscortWave && this.attackBudgetSpent === 0 && remaining >= 3) {
                    type = 'raider'; cost = 3;
                } else if (this.wave >= 6 && roll < 0.18 && remaining >= 3) {
                    type = 'raider'; cost = 3;
                } else if (this.wave >= 2 && roll < 0.5 && remaining >= 2) {
                    type = 'interceptor'; cost = 2;
                }
                this.attackBudgetSpent += cost;
                const x = 35 + Math.random() * (CONFIG.VIRTUAL_WIDTH - 70);
                const enemy = type === 'scout' ? new Scout(x, -28) :
                    type === 'interceptor' ? new Interceptor(x, -32) : new HeavyRaider(x, -40);
                if (this.isEscortWave && type === 'raider') {
                    enemy.hp = enemy.maxHp = 12 + Math.floor(this.wave / 4) * 2;
                    enemy.baseReward *= 2;
                }
                entities.enemies.push(enemy);
                return true;
            }

            // The garden drifts through between waves: harmless colour, small points.
            spawnDrifters() {
                if (this.wave < 2) return;
                const count = 1 + Math.floor(Math.random() * 3);
                for (let i = 0; i < count; i++) {
                    entities.enemies.push(new Drifter(30 + Math.random() * (CONFIG.VIRTUAL_WIDTH - 60), -30 - i * 40));
                }
            }

            spawnAsteroids() {
                entities.asteroids.push(new Asteroid(40, -60, 'medium'));
            }
        }

        let director = null;

        // ============================================
        // COLLISION & COMBAT
        // ============================================
        function checkCollisions() {
            // Player bullets vs enemies
            for (let i = entities.playerBullets.length - 1; i >= 0; i--) {
                const bullet = entities.playerBullets[i];

                for (let j = entities.enemies.length - 1; j >= 0; j--) {
                    const enemy = entities.enemies[j];
                    const dx = bullet.x - enemy.x;
                    const dy = bullet.y - enemy.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < enemy.size / 2 + 2 && !bullet.hitTargets.has(enemy)) {
                        bullet.hitTargets.add(enemy);
                        enemy.hit();

                        if (++bullet.pierceCount >= bullet.maxPierce) {
                            entities.playerBullets.splice(i, 1);
                        }

                        if (enemy.isDead()) {
                            playEnemyDeath();
                            const reward = enemy.getReward();
                            game.score += reward;
                            game.combo++;
                            game.comboTimer = CONFIG.COMBO_TIMEOUT;
                            game.peakCombo = Math.max(game.peakCombo, game.combo);
                            game.enemiesDestroyed++;
                            playComboTick(Math.min(4, Math.floor(game.combo / 10)));
                            triggerScreenFlash(0.1, 'white');
                            triggerScreenShake(3);
                            spawnExplosion(enemy.x, enemy.y, 12, 'rgb(255, 150, 100)');

                            // Floating text for score
                            const scoreText = new FloatingText(enemy.x, enemy.y, `+${reward}`, 'rgb(255, 215, 0)', 14, 1.0);
                            entities.floatingTexts.push(scoreText);

                            // Combo milestone floating text
                            if (game.combo % 5 === 0 && game.combo > 0) {
                                const comboText = new FloatingText(CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT / 4, `x${game.combo} COMBO!`, 'rgb(255, 150, 50)', 16, 1.0);
                                entities.floatingTexts.push(comboText);
                            }

                            // Pickup drop for Scout, Interceptor, and HeavyRaider
                            let dropChance = 0;
                            if (enemy.constructor.name === 'Scout') {
                                dropChance = 0.15;
                            } else if (enemy.constructor.name === 'Interceptor') {
                                dropChance = 0.30;
                            } else if (enemy.constructor.name === 'HeavyRaider') {
                                dropChance = 0.60;
                            }

                            if (dropChance > 0 && Math.random() < dropChance) {
                                const types = ['energy', 'score', 'rapid_fire', 'energy', 'score', 'rapid_fire', 'spiral'];
                                const type = types[Math.floor(Math.random() * types.length)];
                                const pickup = new Pickup(enemy.x, enemy.y, type);
                                entities.pickups.push(pickup);
                            }

                            entities.enemies.splice(j, 1);
                        }
                        break;
                    }
                }
            }

            // Enemy bullets vs player
            if (entities.player && entities.player.iframes <= 0) {
                for (let i = entities.enemyBullets.length - 1; i >= 0; i--) {
                    const bullet = entities.enemyBullets[i];
                    const dx = bullet.x - entities.player.x;
                    const dy = bullet.y - entities.player.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < entities.player.radius + bullet.radius) {
                        if (entities.player.hit()) {
                            game.state = GameState.GAME_OVER;
                            return;
                        }
                        entities.enemyBullets.splice(i, 1);
                    }
                }
            }

            // Player bullets vs asteroids
            for (let i = entities.playerBullets.length - 1; i >= 0; i--) {
                const bullet = entities.playerBullets[i];

                for (let j = entities.asteroids.length - 1; j >= 0; j--) {
                    const asteroid = entities.asteroids[j];
                    const dx = bullet.x - asteroid.x;
                    const dy = bullet.y - asteroid.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < asteroid.radius + 2 && !bullet.hitTargets.has(asteroid)) {
                        bullet.hitTargets.add(asteroid);
                        asteroid.hit();

                        if (++bullet.pierceCount >= bullet.maxPierce) {
                            entities.playerBullets.splice(i, 1);
                        }

                        if (asteroid.isDead()) {
                            asteroid.spawn();
                            entities.asteroids.splice(j, 1);
                        }
                        break;
                    }
                }
            }

            // Enemy bullets vs asteroids
            for (let i = entities.enemyBullets.length - 1; i >= 0; i--) {
                const bullet = entities.enemyBullets[i];

                for (let j = entities.asteroids.length - 1; j >= 0; j--) {
                    const asteroid = entities.asteroids[j];
                    const dx = bullet.x - asteroid.x;
                    const dy = bullet.y - asteroid.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < asteroid.radius + bullet.radius) {
                        asteroid.hit();
                        entities.enemyBullets.splice(i, 1);

                        if (asteroid.isDead()) {
                            asteroid.spawn();
                            entities.asteroids.splice(j, 1);
                        }
                        break;
                    }
                }
            }

            // Player vs asteroids
            if (entities.player && entities.player.iframes <= 0) {
                for (const asteroid of entities.asteroids) {
                    if (asteroid.collidesWith(entities.player.x, entities.player.y, entities.player.radius)) {
                        if (entities.player.hit()) {
                            game.state = GameState.GAME_OVER;
                            return;
                        }
                    }
                }
            }

            // Ship hulls are hazards too; phase roll safely crosses them.
            if (entities.player && entities.player.iframes <= 0) {
                for (const enemy of entities.enemies) {
                    if (Math.hypot(enemy.x - entities.player.x, enemy.y - entities.player.y) < entities.player.radius + enemy.size * 0.4) {
                        if (entities.player.hit()) {
                            game.state = GameState.GAME_OVER;
                            return;
                        }
                        break;
                    }
                }
            }

            // Player vs pickups
            if (entities.player) {
                const baseRadius = 20;
                const magnetRadius = game.upgrades.includes('Magnet Pull') ? 120 : baseRadius;

                for (let i = entities.pickups.length - 1; i >= 0; i--) {
                    const pickup = entities.pickups[i];
                    const dx = pickup.x - entities.player.x;
                    const dy = pickup.y - entities.player.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < magnetRadius) {
                        pickup.collect();
                        entities.pickups.splice(i, 1);
                    }
                }
            }

            // Near-miss detection
            if (entities.player && entities.player.iframes <= 0) {
                for (const bullet of entities.enemyBullets) {
                    const dx = bullet.x - entities.player.x;
                    const dy = bullet.y - entities.player.y;
                    const dist = Math.hypot(dx, dy);

                    if (!bullet.grazed && dist > entities.player.radius + bullet.radius && dist < entities.player.radius + CONFIG.NEAR_MISS_RADIUS) {
                        bullet.grazed = true;
                        entities.player.rollCooldown = Math.max(0, entities.player.rollCooldown - 0.25);
                        game.score += CONFIG.NEAR_MISS_SCORE;
                        game.nearMissCount++;
                        game.daredevilChain++;
                        playNearMiss();

                        // Floating text for near miss
                        const nearMissText = new FloatingText(entities.player.x + 40, entities.player.y - 30, 'NEAR MISS!', 'rgb(100, 200, 255)', 12, 0.8);
                        entities.floatingTexts.push(nearMissText);

                        if (game.daredevilChain >= CONFIG.DAREDEVIL_CHAIN) {
                            game.score += CONFIG.DAREDEVIL_BONUS;
                            game.daredevilChain = 0;
                        }

                        // Visual effect
                        spawnExplosion(entities.player.x, entities.player.y, 4, 'rgba(255, 200, 100, 0.6)');
                    }
                }
            }
        }

        // ============================================
        // RENDERING
        // ============================================
        function drawBackground(ctx) {
            const t = backgroundAnimationTime;
            const wave = game.wave || 0;
            const gradient = ctx.createLinearGradient(0, 0, 280, 640);
            gradient.addColorStop(0, '#050e1b');
            gradient.addColorStop(.5, wave % 4 === 3 ? '#171329' : '#0c2030');
            gradient.addColorStop(1, '#040a13');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 360, 640);
            ctx.save();
            ctx.globalAlpha = .55;
            drawNebulae(ctx, t, wave);
            ctx.restore();
            drawStarfield(ctx, t);
            drawDistantPlanets(ctx, t, wave);
            const shade = ctx.createRadialGradient(180, 290, 100, 180, 320, 400);
            shade.addColorStop(0, 'rgba(0,0,0,0)');
            shade.addColorStop(1, 'rgba(1,7,15,.65)');
            ctx.fillStyle = shade;
            ctx.fillRect(0, 0, 360, 640);
        }

        function drawHUD(ctx) {
            ctx.save();
            ctx.textBaseline = 'top';
            const backdrop = ctx.createLinearGradient(0, 0, 0, 92);
            backdrop.addColorStop(0, 'rgba(3,12,22,.96)');
            backdrop.addColorStop(1, 'rgba(3,12,22,0)');
            ctx.fillStyle = backdrop;
            ctx.fillRect(0, 0, 360, 92);
            ctx.fillStyle = '#7195a5';
            ctx.font = '9px Arial';
            ctx.fillText('FLIGHT SCORE', 16, 13);
            ctx.fillStyle = '#f0f5ec';
            ctx.font = 'bold 21px Orbitron, Arial';
            ctx.fillText(game.score.toLocaleString(), 15, 27);
            ctx.textAlign = 'center';
            ctx.font = '9px Arial';
            ctx.fillStyle = '#7195a5';
            ctx.fillText('SECTOR', 192, 13);
            ctx.fillStyle = '#90e8d1';
            ctx.font = 'bold 17px Orbitron, Arial';
            ctx.fillText(String(game.wave).padStart(2, '0'), 192, 29);
            ctx.textAlign = 'right';
            ctx.font = '9px Arial';
            ctx.fillStyle = '#7195a5';
            ctx.fillText('HULL', 344, 13);
            for (let i = 0; i < entities.player.maxHp; i++) {
                ctx.fillStyle = i < entities.player.hp ? '#90e8d1' : '#253946';
                ctx.fillRect(335 - i * 14, 31, 9, 13);
            }
            if (game.combo > 0) {
                ctx.textAlign = 'left';
                ctx.font = 'bold 10px Arial';
                ctx.fillStyle = '#f4c87b';
                ctx.fillText(`CHAIN ${game.combo}`, 16, 54);
            }
            let y = 75;
            ctx.textAlign = 'left';
            for (const [id, remaining] of Object.entries(game.upgradeTimers)) {
                const frac = Math.max(0, remaining / (UPGRADE_DURATIONS[id] || 30));
                ctx.font = '9px Arial';
                ctx.fillStyle = remaining < 8 ? '#ffac89' : '#adc9d5';
                ctx.fillText(id.toUpperCase(), 16, y);
                ctx.fillStyle = '#193747';
                ctx.fillRect(16, y + 12, 72, 3);
                ctx.fillStyle = remaining < 8 ? '#ffac89' : '#90e8d1';
                ctx.fillRect(16, y + 12, 72 * frac, 3);
                y += 24;
            }
            ctx.restore();
        }

        function drawUpgradeIcon(ctx, iconId, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            const s = size / 2;

            // Color by category
            let baseColor, glowColor;
            if (['tentacle_split','tentacle_rapid','tentacle_pierce','eye_target'].includes(iconId)) {
                baseColor = 'rgb(255, 80, 120)'; glowColor = 'rgba(255, 80, 120, 0.3)';
            } else if (['shell_shield','ghost_phase','ink_cloud','healing_tentacle'].includes(iconId)) {
                baseColor = 'rgb(80, 200, 255)'; glowColor = 'rgba(80, 200, 255, 0.3)';
            } else {
                baseColor = 'rgb(180, 120, 255)'; glowColor = 'rgba(180, 120, 255, 0.3)';
            }

            // Background glow circle
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
            grad.addColorStop(0, glowColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(-s, -s, s*2, s*2);

            ctx.strokeStyle = baseColor;
            ctx.fillStyle = baseColor;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';

            const t = Date.now() / 1000; // For animation

            switch(iconId) {
                case 'tentacle_split':
                    // Central eye with 3 splitting tentacles
                    ctx.beginPath(); ctx.arc(0, 0, s*0.25, 0, Math.PI*2); ctx.fill();
                    for (let i = -1; i <= 1; i++) {
                        const angle = -Math.PI/2 + i * 0.8;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        const wave = Math.sin(t * 4 + i) * 3;
                        ctx.quadraticCurveTo(Math.cos(angle)*s*0.4 + wave, Math.sin(angle)*s*0.4, Math.cos(angle)*s*0.85, Math.sin(angle)*s*0.85);
                        ctx.stroke();
                    }
                    break;
                case 'tentacle_rapid':
                    // Multiple fast tentacle strikes
                    for (let i = 0; i < 4; i++) {
                        const offset = Math.sin(t * 8 + i * 1.5) * 2;
                        ctx.beginPath();
                        ctx.moveTo(-s*0.3 + i*s*0.2, s*0.5);
                        ctx.lineTo(-s*0.3 + i*s*0.2 + offset, -s*0.6);
                        ctx.stroke();
                        ctx.beginPath(); ctx.arc(-s*0.3 + i*s*0.2 + offset, -s*0.7, 2, 0, Math.PI*2); ctx.fill();
                    }
                    break;
                case 'tentacle_pierce':
                    // Single tentacle piercing through
                    ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(0, s*0.8); ctx.lineTo(0, -s*0.8); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-2, -s*0.8); ctx.lineTo(0, -s); ctx.lineTo(2, -s*0.8); ctx.stroke();
                    // Pierce marks
                    ctx.globalAlpha = 0.5;
                    ctx.beginPath(); ctx.arc(0, s*0.2, s*0.3, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, -s*0.2, s*0.3, 0, Math.PI*2); ctx.stroke();
                    ctx.globalAlpha = 1;
                    break;
                case 'eye_target':
                    // Large targeting eye
                    ctx.beginPath(); ctx.arc(0, 0, s*0.6, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, 0, s*0.3, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = baseColor;
                    ctx.beginPath(); ctx.arc(0, 0, s*0.15, 0, Math.PI*2); ctx.fill();
                    // Crosshair
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(0, -s*0.8); ctx.lineTo(0, -s*0.45); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, s*0.8); ctx.lineTo(0, s*0.45); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-s*0.8, 0); ctx.lineTo(-s*0.45, 0); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(s*0.8, 0); ctx.lineTo(s*0.45, 0); ctx.stroke();
                    break;
                case 'shell_shield':
                    // Nautilus shell spiral
                    ctx.beginPath();
                    for (let a = 0; a < Math.PI * 4; a += 0.1) {
                        const r = s * 0.15 + a * s * 0.05;
                        const px = Math.cos(a) * r * 0.5;
                        const py = Math.sin(a) * r * 0.5;
                        if (a === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.stroke();
                    break;
                case 'ghost_phase':
                    // Ghostly octopus fading
                    ctx.globalAlpha = 0.4 + Math.sin(t * 3) * 0.3;
                    ctx.beginPath(); ctx.arc(0, -s*0.2, s*0.35, 0, Math.PI*2); ctx.fill();
                    for (let i = 0; i < 4; i++) {
                        const wave = Math.sin(t * 5 + i * 2) * 3;
                        ctx.beginPath();
                        ctx.moveTo(-s*0.3 + i*s*0.2, 0);
                        ctx.lineTo(-s*0.3 + i*s*0.2 + wave, s*0.7);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                    break;
                case 'ink_cloud':
                    // Ink cloud burst
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2 + t;
                        const r = s * 0.3 + Math.sin(t * 2 + i) * s * 0.15;
                        ctx.globalAlpha = 0.3 + Math.sin(t * 3 + i) * 0.2;
                        ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, s*0.25, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    break;
                case 'healing_tentacle':
                    // Gentle curling tentacle with glow points
                    ctx.beginPath();
                    ctx.moveTo(0, s*0.7);
                    ctx.bezierCurveTo(-s*0.5, s*0.2, s*0.5, -s*0.3, 0, -s*0.7);
                    ctx.stroke();
                    for (let i = 0; i < 3; i++) {
                        const py = s*0.4 - i*s*0.4;
                        ctx.fillStyle = `rgba(80, 255, 200, ${0.5 + Math.sin(t * 4 + i) * 0.3})`;
                        ctx.beginPath(); ctx.arc(Math.sin(t * 3 + i) * 3, py, 3, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.fillStyle = baseColor;
                    break;
                case 'sucker_pull':
                    // Octopus sucker pulling inward
                    ctx.beginPath(); ctx.arc(0, 0, s*0.5, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, 0, s*0.25, 0, Math.PI*2); ctx.fill();
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2;
                        const fromR = s * 0.85;
                        const toR = s * 0.55;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(a) * fromR, Math.sin(a) * fromR);
                        ctx.lineTo(Math.cos(a) * toR, Math.sin(a) * toR);
                        ctx.stroke();
                        // Arrow tips
                        ctx.beginPath(); ctx.arc(Math.cos(a) * toR, Math.sin(a) * toR, 2, 0, Math.PI*2); ctx.fill();
                    }
                    break;
                case 'chain_tentacle':
                    // Chain of connected nodes
                    for (let i = 0; i < 5; i++) {
                        const px = -s*0.6 + i * s*0.3;
                        const py = Math.sin(t * 3 + i * 1.2) * s*0.2;
                        ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
                        if (i > 0) {
                            const prevX = -s*0.6 + (i-1) * s*0.3;
                            const prevY = Math.sin(t * 3 + (i-1) * 1.2) * s*0.2;
                            ctx.beginPath(); ctx.moveTo(prevX, prevY); ctx.lineTo(px, py); ctx.stroke();
                        }
                    }
                    break;
                case 'jet_squid':
                    // Squid jetting forward
                    ctx.beginPath();
                    ctx.moveTo(0, -s*0.7);
                    ctx.lineTo(s*0.3, s*0.1);
                    ctx.lineTo(s*0.15, s*0.5);
                    ctx.lineTo(-s*0.15, s*0.5);
                    ctx.lineTo(-s*0.3, s*0.1);
                    ctx.closePath();
                    ctx.fill();
                    // Jet trail
                    ctx.strokeStyle = `rgba(100, 200, 255, ${0.4 + Math.sin(t * 6) * 0.3})`;
                    for (let i = 0; i < 3; i++) {
                        const wave = Math.sin(t * 8 + i * 2) * 3;
                        ctx.beginPath();
                        ctx.moveTo(-s*0.1 + i*s*0.1, s*0.5);
                        ctx.lineTo(-s*0.1 + i*s*0.1 + wave, s*0.9);
                        ctx.stroke();
                    }
                    break;
                case 'treasure_eye':
                    // Glowing treasure eye
                    ctx.beginPath(); ctx.arc(0, 0, s*0.5, 0, Math.PI*2); ctx.stroke();
                    const eyeGlow = 0.5 + Math.sin(t * 4) * 0.5;
                    ctx.fillStyle = `rgba(255, 220, 50, ${eyeGlow})`;
                    ctx.beginPath();
                    ctx.moveTo(-s*0.35, 0);

                    ctx.fill();
                    ctx.fillStyle = baseColor;
                    ctx.beginPath(); ctx.arc(0, 0, s*0.1, 0, Math.PI*2); ctx.fill();

        function drawUpgradeDraft(ctx, upgrades) {
            ctx.save();

            ctx.fillStyle = '#9db3c2';
            ctx.fillText('Refit your ship. Keep the signal alive.', 180, 88);

            const cardWidth = 100;
            const cardHeight = 220;
            const gap = 10;
            const totalWidth = cardWidth * upgrades.length + gap * (upgrades.length - 1);
            const startX = (CONFIG.VIRTUAL_WIDTH - totalWidth) / 2;
            const startY = 120;

            for (let i = 0; i < upgrades.length; i++) {
                const upgrade = upgrades[i];
                const cx = startX + i * (cardWidth + gap);
                const cy = startY;

                // Card background with gradient border
                const cardGrad = ctx.createLinearGradient(cx, cy, cx, cy + cardHeight);
                cardGrad.addColorStop(0, 'rgba(22, 49, 63, 0.98)');
                cardGrad.addColorStop(1, 'rgba(9, 24, 38, 0.98)');
                ctx.fillStyle = cardGrad;

                // Rounded rect
                const r = 6;
                ctx.beginPath();
                ctx.moveTo(cx + r, cy);
                ctx.lineTo(cx + cardWidth - r, cy);
                ctx.quadraticCurveTo(cx + cardWidth, cy, cx + cardWidth, cy + r);
                ctx.lineTo(cx + cardWidth, cy + cardHeight - r);
                ctx.quadraticCurveTo(cx + cardWidth, cy + cardHeight, cx + cardWidth - r, cy + cardHeight);
                ctx.lineTo(cx + r, cy + cardHeight);
                ctx.quadraticCurveTo(cx, cy + cardHeight, cx, cy + cardHeight - r);
                ctx.lineTo(cx, cy + r);
                ctx.quadraticCurveTo(cx, cy, cx + r, cy);
                ctx.closePath();
                ctx.fill();

                // Border glow
                let borderColor = 'rgba(100, 100, 255, 0.6)';
                if (upgrade.type === 'offense') borderColor = 'rgba(255, 80, 120, 0.6)';
                else if (upgrade.type === 'defense') borderColor = 'rgba(80, 200, 255, 0.6)';
                else if (upgrade.type === 'utility') borderColor = 'rgba(180, 120, 255, 0.6)';
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Draw icon
                drawUpgradeIcon(ctx, upgrade.drawIcon, cx + cardWidth/2, cy + 40, 40);

                // Name
                ctx.font = 'bold 12px Arial';
                ctx.fillStyle = 'rgb(220, 220, 240)';
                ctx.textAlign = 'center';
                upgrade.name.split(' ').forEach((word, j) => ctx.fillText(word, cx + cardWidth / 2, cy + 85 + j * 16));

                // Description
                ctx.font = '12px Arial';
                ctx.fillStyle = '#a9beca';
                // Word wrap for short descriptions
                const words = upgrade.desc.split(' ');
                let line = '';
                let lineY = cy + 140;
                for (const word of words) {
                    const test = line + word + ' ';
                    if (ctx.measureText(test).width > cardWidth - 10 && line) {
                        ctx.fillText(line.trim(), cx + cardWidth/2, lineY);
                        line = word + ' ';

        document.body.appendChild(pauseSheet);

        pauseSheet.addEventListener('keydown', e => {

        function clearFlightInput() {
            for (const key in keyState) delete keyState[key];
            const oldPointer = movementPointer;
            movementPointer = null;
            lastPointerPosition = null;
            if (oldPointer !== null && canvas.hasPointerCapture(oldPointer)) canvas.releasePointerCapture(oldPointer);
            if (entities.player) {
                entities.player.inputLeft = entities.player.inputRight = false;
                entities.player.inputUp = entities.player.inputDown = false;
                entities.player.vx = entities.player.vy = 0;
            }
        }

        function setGamePaused(paused = true) {
            if (paused && (game.state === GameState.PLAYING || game.state === GameState.UPGRADE_DRAFT)) {
                game.previousState = game.state;
                game.state = GameState.PAUSED;
                clearFlightInput();
                if (bgmAudio) bgmAudio.pause();
                syncInputControls();
                resumeControl.focus({ preventScroll: true });
            } else if (!paused && game.state === GameState.PAUSED) {
                clearFlightInput();
                game.state = game.previousState || GameState.PLAYING;
                if (bgmAudio && !game.muted) bgmAudio.play().catch(() => {});
                syncInputControls();
                canvas.focus({ preventScroll: true });
            }
        }
        function togglePause() { setGamePaused(game.state !== GameState.PAUSED); }
        function toggleSound() {
            initAudio();
            game.muted = !game.muted;
            writeRecord('kuiper_muted', game.muted);
            if (bgmAudio) {
                bgmAudio.volume = game.muted ? 0 : 0.3;
                if (game.muted) bgmAudio.pause();
                else if (game.state === GameState.PLAYING) bgmAudio.play().catch(() => {});
            }
            syncInputControls();
        }
        muteControl.addEventListener('click', toggleSound);
        pauseControl.addEventListener('click', togglePause);
        // Pointer-down roll lets the other finger keep steering without a delayed click.
        rollControl.addEventListener('pointerdown', e => {
            e.preventDefault();
            if (game.state === GameState.PLAYING) entities.player?.phaseRoll();
        });
        rollControl.addEventListener('click', e => {
            if (e.detail === 0 && game.state === GameState.PLAYING) entities.player?.phaseRoll();
        });
        canvas.tabIndex = 0;
        canvas.setAttribute('aria-label', 'Kuiper Blast. Drag to steer, Space to roll, P to pause. Enter to launch.');

        function syncInputControls() {
            if (inputScreen !== game.state) {
                clearFlightInput();
                inputScreen = game.state;
            }
            const rect = canvas.getBoundingClientRect();
            const sideControls = window.innerHeight < 480 && window.innerWidth - rect.width > 260;
            flightControls.style.flexDirection = sideControls ? 'column' : 'row';
            flightControls.style.gap = sideControls ? '12px' : '0';
            flightControls.style.left = `${sideControls ? rect.right + 20 : rect.left}px`;
            flightControls.style.width = `${sideControls ? 120 : rect.width}px`;
            flightControls.style.top = `${sideControls ? Math.max(20, (window.innerHeight - 180) / 2) : (window.innerHeight - rect.bottom >= 64 ? rect.bottom + 8 : Math.max(rect.top, rect.bottom - 64))}px`;
            flightControls.hidden = game.state !== GameState.PLAYING && game.state !== GameState.UPGRADE_DRAFT;
            pauseSheet.hidden = game.state !== GameState.PAUSED;
            logControl.hidden = game.state !== GameState.START && game.state !== GameState.GAME_OVER;
            logControl.style.left = `${rect.left + 12}px`;
            logControl.style.top = `${Math.max(rect.top + 12, 12)}px`;
            muteControl.textContent = game.muted ? 'MUTED' : 'SOUND';
            muteControl.setAttribute('aria-label', game.muted ? 'Unmute sound' : 'Mute sound');
            muteControl.setAttribute('aria-pressed', String(game.muted));
            const remaining = entities.player?.rollCooldown || 0;
            rollControl.disabled = game.state !== GameState.PLAYING || remaining > 0;

        }

        function selectUpgrade(index) {
            if (game.state !== GameState.UPGRADE_DRAFT || !game.pendingUpgrades?.[index]) return;
            applyUpgrade(game.pendingUpgrades[index].id);
            game.pendingUpgrades = null;
            game.state = GameState.PLAYING;
            clearFlightInput();
            syncInputControls();
        }

        window.addEventListener('keydown', e => {
            if (window.expedition?.isOpen?.()) return;
            const key = e.key.toLowerCase();
            // Let focused native buttons own their Enter/Space activation.
            if (e.target instanceof HTMLButtonElement && (key === 'enter' || key === ' ')) return;
            if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' ', 'shift', 'p', 'escape', 'enter', '1', '2', '3'].includes(key)) e.preventDefault();
            if (e.repeat) return;
            if (key === 'p' || key === 'escape') { togglePause(); return; }
            if (key === 'm') { toggleSound(); return; }
            if (game.state === GameState.PAUSED) {
                if (key === 'enter' || key === ' ') setGamePaused(false);
                return;
            }
            if (game.state === GameState.START || game.state === GameState.GAME_OVER) {
                if (key === 'enter' || key === ' ') { initAudio(); clearFlightInput(); startGame(); syncInputControls(); }
                return;
            }
            if (game.state === GameState.UPGRADE_DRAFT) { if (/^[123]$/.test(key)) selectUpgrade(Number(key) - 1); return; }
            if (game.state === GameState.PLAYING) {
                keyState[key] = true;
                if (key === ' ' || key === 'shift') entities.player?.phaseRoll();

        });
        window.addEventListener('keyup', e => { delete keyState[e.key.toLowerCase()]; });

        function updateKeyboardInput() {
            if (!entities.player) return;
            entities.player.inputLeft = !!(keyState.a || keyState.arrowleft);
            entities.player.inputRight = !!(keyState.d || keyState.arrowright);
            entities.player.inputUp = !!(keyState.w || keyState.arrowup);
            entities.player.inputDown = !!(keyState.s || keyState.arrowdown);

        function getTouchVirtualPos(pointer) {
            const rect = canvas.getBoundingClientRect();

        }
        function handleTouchTap(vx, vy) {
            if (game.state !== GameState.UPGRADE_DRAFT || !game.pendingUpgrades) return false;
            const cardWidth = 100, cardHeight = 220, gap = 10;
            const startX = (CONFIG.VIRTUAL_WIDTH - (cardWidth * game.pendingUpgrades.length + gap * (game.pendingUpgrades.length - 1))) / 2;
            game.pendingUpgrades.some((upgrade, i) => {
                const x = startX + i * (cardWidth + gap);
                if (vx >= x && vx < x + cardWidth && vy >= 120 && vy < 120 + cardHeight) { selectUpgrade(i); return true; }
                return false;
            });
            return true;
        }
        canvas.addEventListener('pointerdown', e => {
            if (e.button !== 0) return;

            if (game.state === GameState.START || game.state === GameState.GAME_OVER) {
                clearFlightInput(); startGame(); syncInputControls(); return;
            }
            const pos = getTouchVirtualPos(e);
            if (handleTouchTap(pos.x, pos.y)) return;
            if (game.state !== GameState.PLAYING || !entities.player || movementPointer !== null) return;
            movementPointer = e.pointerId;
            lastPointerPosition = pos;
            // Start at the ship, not the finger: re-grabbing never teleports or snaps it.

            touchTargetY = entities.player.y;

            touchTargetY = Math.max(radius, Math.min(CONFIG.VIRTUAL_HEIGHT - radius, touchTargetY + pos.y - lastPointerPosition.y));
            lastPointerPosition = pos;
        });

        canvas.addEventListener('lostpointercapture', releaseMovement);
        function updateTouchMovement() {
            if (movementPointer === null || !entities.player || game.state !== GameState.PLAYING) return;
            const p = entities.player;
            const dx = touchTargetX - p.x, dy = touchTargetY - p.y;
            const deadzone = 5;
            p.inputLeft = dx < -deadzone;
            p.inputRight = dx > deadzone;
            p.inputUp = dy < -deadzone;
            p.inputDown = dy > deadzone;
        }

        // ============================================
        // GAME INITIALIZATION
        // ============================================
        async function initGame() {
            // Load all sprites from embedded data
            await loadAllSprites();

            // Create player
            entities.player = new Player(CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT - 80);

            // Initialize director
            director = new Director();

            generateDistantPlanets();

        function startGame() {
            CONFIG.PLAYER_SPEED = 280;
            CONFIG.COMBO_TIMEOUT = 3;
            CONFIG.ROLL_IFRAMES = 0.35;
            game.state = GameState.PLAYING;
            game.time = 0;
            game.score = 0;
            game.wave = 1;

            entities.playerBullets = [];
            entities.enemies = [];
            entities.enemyBullets = [];
            entities.particles = [];
            entities.pickups = [];
            entities.floatingTexts = [];
            entities.asteroids = [];
            entities.shootingStars = [];
            entities.spiralMissiles = [];
            spiralCooldown = 0;

            director = new Director();
            game.waveBanner = { text: 'WAVE 1 · OUTER BELT', timer: 0, duration: 2.5 };
            game.crypticMessage = null;
            lastMilestone = 0;

            // Regenerate background elements for variety
            generateStarfield();
            generateNebulae();
            generateDistantPlanets();

            // Start BGM
            if (bgmAudio && !game.muted) {
                bgmAudio.play().catch(() => {});
            }
            // Retry BGM init in case audio context wasn't ready earlier
            if (!bgmAudio) initBGM();

            if (entities.player) {
                entities.player.vx = 0;
                entities.player.vy = 0;
                entities.player.spriteState = 'neutral';
                entities.player.x = CONFIG.VIRTUAL_WIDTH / 2;
                entities.player.y = CONFIG.VIRTUAL_HEIGHT - 80;
                entities.player.maxHp = CONFIG.PLAYER_HP;
                entities.player.hp = CONFIG.PLAYER_HP;
                entities.player.fireRate = CONFIG.PLAYER_FIRE_RATE;
                entities.player.projectilesPerShot = 2;
                entities.player.iframes = 1.5;
                entities.player.shotCount = 0;
                entities.player.repairTimer = 0;
                entities.player.forgivenessCooldown = 0;
                entities.player.rollCooldown = 0;
                entities.player.rolling = false;
                entities.player.rollTimer = 0;
                entities.player.fireTimer = 0;
                entities.player.inputLeft = false;
                entities.player.inputRight = false;
                entities.player.inputUp = false;
                entities.player.inputDown = false;
            }

            game.upgradeTime = 0;
            game.difficulty = 1;
            game.directorTime = 0;
        }

        // ============================================
        // GAME LOOP
        // ============================================
        let lastTime = Date.now();

        function gameLoop() {
            const now = Date.now();
            const dt = Math.min((now - lastTime) / 1000, 0.033);
            lastTime = now;

            // Always update background animation time
            backgroundAnimationTime += dt;

            // Update game state
            if (game.state === GameState.PLAYING) {
                game.time += dt;
                updateUpgradeTimers(dt);
                game.comboTimer -= dt;
                if (game.comboTimer <= 0 && game.combo > 0) {
                    const comboLostText = new FloatingText(CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT / 3, 'COMBO LOST', 'rgba(150, 150, 150, 0.8)', 14, 0.8);
                    entities.floatingTexts.push(comboLostText);
                    game.combo = 0;
                }

                // Update entities
                updateKeyboardInput();
                updateTouchMovement();

                if (entities.player) {
                    entities.player.update(dt);
                }

                // Update enemies and their bullets
                for (let i = entities.enemies.length - 1; i >= 0; i--) {
                    entities.enemies[i].update(dt);
                    if (entities.enemies[i].isOffScreen()) {
                        if (!entities.enemies[i].isDrifter) director.escaped++;
                        entities.enemies.splice(i, 1);
                    }
                }

                for (let i = entities.enemyBullets.length - 1; i >= 0; i--) {
                    entities.enemyBullets[i].update(dt);
                    if (entities.enemyBullets[i].isDead()) {
                        entities.enemyBullets.splice(i, 1);
                    }
                }

                // Update player bullets
                for (let i = entities.playerBullets.length - 1; i >= 0; i--) {
                    entities.playerBullets[i].update(dt);
                    if (entities.playerBullets[i].isDead()) {
                        entities.playerBullets.splice(i, 1);
                    }
                }

                // Update asteroids
                for (let i = entities.asteroids.length - 1; i >= 0; i--) {
                    entities.asteroids[i].update(dt);
                    if (entities.asteroids[i].isOffScreen()) {
                        entities.asteroids.splice(i, 1);
                    }
                }

                // Update particles
                for (let i = entities.particles.length - 1; i >= 0; i--) {
                    entities.particles[i].update(dt);
                    if (entities.particles[i].isDead()) {
                        entities.particles.splice(i, 1);
                    }
                }

                // Update pickups
                for (let i = entities.pickups.length - 1; i >= 0; i--) {
                    entities.pickups[i].update(dt);
                    if (entities.pickups[i].isDead()) {
                        entities.pickups.splice(i, 1);
                    }
                }

                // Update spiral missiles
                if (spiralCooldown > 0) spiralCooldown -= dt;
                for (let i = entities.spiralMissiles.length - 1; i >= 0; i--) {
                    entities.spiralMissiles[i].update(dt);
                    if (entities.spiralMissiles[i].isDead()) {
                        entities.spiralMissiles.splice(i, 1);
                        continue;
                    }
                    // Collision with enemies
                    const m = entities.spiralMissiles[i];
                    if (!m) continue;
                    for (let j = entities.enemies.length - 1; j >= 0; j--) {
                        const enemy = entities.enemies[j];
                        const dx = m.x - enemy.x;
                        const dy = m.y - enemy.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < m.radius + enemy.size / 2) {
                            enemy.hp -= m.damage;
                            spawnExplosion(enemy.x, enemy.y, 8, `hsl(${m.hue}, 100%, 60%)`);
                            if (enemy.hp <= 0) {
                                const reward = enemy.getReward();
                                game.score += reward;
                                game.enemiesDestroyed++;
                                spawnExplosion(enemy.x, enemy.y, 15, 'rgb(255, 200, 50)');
                                playEnemyDeath();
                                entities.enemies.splice(j, 1);
                            } else {
                                playEnemyHit();
                            }
                            // Missile continues (pierces!) but loses some life
                            m.life -= 0.5;
                            break;
                        }
                    }
                    // Collision with asteroids
                    if (m && !m.isDead()) {
                        for (let j = entities.asteroids.length - 1; j >= 0; j--) {
                            const ast = entities.asteroids[j];
                            const dx = m.x - ast.x;
                            const dy = m.y - ast.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist < m.radius + ast.radius) {
                                ast.hp -= m.damage;
                                spawnExplosion(ast.x, ast.y, 6, `hsl(${m.hue}, 100%, 60%)`);
                                if (ast.hp <= 0) {
                                    spawnExplosion(ast.x, ast.y, 12, 'rgb(180, 180, 180)');
                                    entities.asteroids.splice(j, 1);
                                }
                                m.life -= 0.3;
                                break;
                            }
                        }
                    }
                }

                // Update floating texts
                for (let i = entities.floatingTexts.length - 1; i >= 0; i--) {
                    entities.floatingTexts[i].update(dt);
                    if (entities.floatingTexts[i].isDead()) {
                        entities.floatingTexts.splice(i, 1);
                    }
                }

                // Update wave banner
                if (game.waveBanner) {
                    game.waveBanner.timer += dt;
                    if (game.waveBanner.timer >= game.waveBanner.duration) {
                        game.waveBanner = null;
                    }
                }

                // Update cryptic message
                if (game.crypticMessage) {
                    game.crypticMessage.timer += dt;
                    if (game.crypticMessage.timer >= game.crypticMessage.duration) {
                        game.crypticMessage = null;
                    }
                }

                // Shooting stars spawn ~0.5% chance per frame
                if (Math.random() < 0.005) {
                    entities.shootingStars.push(new ShootingStar());
                }

                // Update shooting stars
                for (let i = entities.shootingStars.length - 1; i >= 0; i--) {
                    entities.shootingStars[i].update(dt);
                    if (entities.shootingStars[i].isDead()) {
                        entities.shootingStars.splice(i, 1);
                    }
                }

                // Auto spiral burst: triggers every ~40-60s as a surprise gift
                if (spiralCooldown <= 0 && game.time > 30 && Director.hostiles() >= 3 && entities.spiralMissiles.length === 0) {
                    if (Math.random() < 0.002) { // ~0.2% per frame ≈ every 8-10s of qualifying time
                        spawnSpiralBurst();
                        spiralCooldown = 35 + Math.random() * 15; // 35-50s minimum between auto-triggers
                    }
                }

                // Score milestone celebrations
                for (const m of SCORE_MILESTONES) {
                    if (game.score >= m && lastMilestone < m) {
                        lastMilestone = m;
                        // Big celebration
                        for (let i = 0; i < 30; i++) {
                            spawnExplosion(
                                Math.random() * CONFIG.VIRTUAL_WIDTH,
                                Math.random() * CONFIG.VIRTUAL_HEIGHT,
                                8, `rgb(${Math.random()*255|0}, ${Math.random()*255|0}, 255)`
                            );
                        }
                        triggerScreenFlash(0.15, 'white');
                        game.crypticMessage = {
                            text: m >= 100000 ? 'LEGENDARY' : m >= 50000 ? 'UNSTOPPABLE' : m >= 25000 ? 'MAGNIFICENT' : m >= 10000 ? 'IMPRESSIVE' : 'NICE',
                            timer: 0, duration: 2
                        };
                        playSound(300, 0.5, 'sine', 0.3, 500);
                        playSound(450, 0.4, 'sine', 0.25, 300);
                        break;
                    }
                }

                // Director spawning
                director.update(dt);

                // Occasional asteroid spawning
                if (director.phase === 'ATTACK' && director.wave >= 3 && entities.asteroids.length < 5 && Math.random() < dt * 0.18) {
                    const x = Math.random() > 0.5 ? -20 : CONFIG.VIRTUAL_WIDTH + 20;
                    const y = Math.random() * CONFIG.VIRTUAL_HEIGHT;
                    const sizes = ['small', 'medium', 'large'];
                    const size = sizes[Math.floor(Math.random() * sizes.length)];
                    entities.asteroids.push(new Asteroid(x, y, size));
                }

                // Collision detection
                checkCollisions();

                // Upgrade draft
                game.upgradeTime += dt;
                if (game.state === GameState.PLAYING && game.upgradeTime >= CONFIG.UPGRADE_INTERVAL) {
                    game.upgradeTime = 0;
                    const upgrades = getRandomUpgrades(3);
                    if (upgrades.length) {
                        game.state = GameState.UPGRADE_DRAFT;
                        game.pendingUpgrades = upgrades;
                    }
                }
            }

            // Update screen effects
            if (screenShake > 0) screenShake -= dt * 20;
            if (screenFlash > 0) screenFlash -= dt;
            if (screenVignette > 0) screenVignette -= dt;

            // Rendering
            renderFrame();

            requestAnimationFrame(gameLoop);
        }

        function renderFrame() {
            if (typeof syncInputControls === "function") syncInputControls();
            window.expedition?.sync(game);
            const scaleX = canvas.width / CONFIG.VIRTUAL_WIDTH;
            const scaleY = canvas.height / CONFIG.VIRTUAL_HEIGHT;

            ctx.save();
            ctx.scale(scaleX, scaleY);

            // Clear and draw background
            drawBackground(ctx);

            // Draw asteroids
            for (const asteroid of entities.asteroids) {
                asteroid.draw(ctx, 0, 0);
            }

            // Draw enemies
            for (const enemy of entities.enemies) {
                enemy.draw(ctx, 0, 0);
            }

            // Draw pickups
            for (const pickup of entities.pickups) {
                pickup.draw(ctx, 0, 0);
            }

            // Draw player bullets
            for (const bullet of entities.playerBullets) {
                bullet.draw(ctx, 0, 0);
            }

            // Draw spiral missiles
            for (const missile of entities.spiralMissiles) {
                missile.draw(ctx, 0, 0);
            }

            // Draw enemy bullets
            for (const bullet of entities.enemyBullets) {
                bullet.draw(ctx, 0, 0);
            }

            // Draw shooting stars
            for (const star of entities.shootingStars) {
                star.draw(ctx);
            }

            // Draw particles
            for (const particle of entities.particles) {
                particle.draw(ctx, 0, 0);
            }

            // Draw floating texts
            for (const floatText of entities.floatingTexts) {
                floatText.draw(ctx, 0, 0);
            }

            // Draw player
            if (entities.player && game.state !== GameState.START) {
                entities.player.draw(ctx, 0, 0);
            }

            // Draw HUD
            if (game.state === GameState.PLAYING && entities.player) {
                drawHUD(ctx);
            }

            // Draw wave banner
            if (game.waveBanner) {
                const bannerAlpha = game.waveBanner.timer < 1.5 ? 1 : Math.max(0, (1.5 - (game.waveBanner.timer - 1.5)) / 0.5);
                ctx.save();
                ctx.globalAlpha = bannerAlpha;
                ctx.fillStyle = 'rgb(255, 200, 100)';
                ctx.font = 'bold 17px Orbitron, Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(game.waveBanner.text, CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT / 2 - 50);
                ctx.restore();
            }

            // Draw cryptic message
            if (game.crypticMessage) {
                const msg = game.crypticMessage;
                const fadeInDuration = 0.5;
                const holdDuration = 2;
                const fadeOutDuration = 1;

                let alpha = 1;
                if (msg.timer < fadeInDuration) {
                    alpha = msg.timer / fadeInDuration;
                } else if (msg.timer > fadeInDuration + holdDuration) {
                    alpha = Math.max(0, 1 - (msg.timer - fadeInDuration - holdDuration) / fadeOutDuration);
                }

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.font = '11px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(msg.text, CONFIG.VIRTUAL_WIDTH / 2, CONFIG.VIRTUAL_HEIGHT / 2);
                ctx.restore();
            }

            // Screen effects
            if (screenFlash > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash})`;
                ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);
            }

            if (screenVignette > 0) {
                ctx.fillStyle = `rgba(255, 100, 100, ${screenVignette * 0.3})`;
                ctx.fillRect(0, 0, CONFIG.VIRTUAL_WIDTH, CONFIG.VIRTUAL_HEIGHT);
            }

            // Draw screens
            if (game.state === GameState.START) {
                drawStartScreen(ctx);
            } else if (game.state === GameState.GAME_OVER) {
                drawGameOverScreen(ctx);
            } else if (game.state === GameState.UPGRADE_DRAFT && game.pendingUpgrades) {
                drawUpgradeDraft(ctx, game.pendingUpgrades);
            }

            ctx.restore();
        }

        // ============================================
        // STARTUP
        // ============================================
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { clearFlightInput(); setGamePaused(true); }
        });
        window.addEventListener('blur', () => { clearFlightInput(); setGamePaused(true); });
        window.addEventListener('resize', () => { clearFlightInput(); syncInputControls(); });

        window.expedition?.configure({ pause: () => setGamePaused(true) });

        // Initialize and start
        initGame().then(() => {
            gameLoop();
        });

        // Save best scores
        setInterval(() => {
            if (game.bestScore < game.score) {
                game.bestScore = game.score;
                localStorage.setItem('kuiper_bestScore', game.bestScore);
            }
            if (game.bestCombo < game.peakCombo) {
                game.bestCombo = game.peakCombo;
                localStorage.setItem('kuiper_bestCombo', game.bestCombo);
            }
        }, 1000);
    </script>
    <script>
        // Show the way home only on the title and game-over screens, so it never sits over live play.
        (function () {
            var link = document.getElementById('kbHome');
            setInterval(function () {
                try { link.hidden = !(game.state === GameState.START || game.state === GameState.GAME_OVER); } catch (e) {}
            }, 250);
        })();
    </script>
